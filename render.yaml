services:
  - type: web
    name: rajora-career-engine-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src uvicorn career_engine.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CAREER_ENGINE_REQUIRE_AUTH
        value: "true"
      - key: CAREER_ENGINE_RELOAD
        value: "false"
      - key: CAREER_ENGINE_ENABLE_DOCS
        value: "false"
      - key: CAREER_ENGINE_ALLOW_CREDENTIALS
        value: "false"
      - key: CAREER_ENGINE_ALLOWED_ORIGINS
        value: https://your-vercel-domain.vercel.app
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
