name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python
        run: python -m py_compile run_app.py src/career_engine/api/main.py src/career_engine/api/schemas.py src/career_engine/ml/model.py src/career_engine/ml/features.py src/career_engine/services/assistant.py src/career_engine/services/roadmap.py

      - name: Check frontend syntax
        run: node --check frontend/app.js

      - name: Run tests
        run: python -m pytest
